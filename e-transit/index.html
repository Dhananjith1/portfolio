  function bytesToBase64(bytes){let binary='';for(const b of bytes)binary+=String.fromCharCode(b);return btoa(binary);}
  async function hashPassengerPassword(password,saltB64){
    if(!window.crypto?.subtle)throw new Error('Secure password storage needs a modern browser on HTTPS or localhost.');
    const salt=Uint8Array.from(atob(saltB64),c=>c.charCodeAt(0));
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},key,256);
    return bytesToBase64(new Uint8Array(bits));
  }
  function startPassengerSession(account,remember){
    session={role:'passenger',email:account.email,name:account.name,cardId:account.cardId,demo:false};

  }
  async function login(email,pw,remember){
    const normalized=String(email||'').trim().toLowerCase();
    const account=passengerAccounts.find(a=>a.email===normalized);
    if(!account){toast('No passenger account found in this browser. Create an account first.');return;}
    try{
      const candidate=await hashPassengerPassword(pw,account.salt);
      if(candidate!==account.passwordHash){toast('Email or password is incorrect.');return;}
      startPassengerSession(account,remember);
    }catch(e){toast(e.message||'Unable to sign in on this browser.');}
  }
  async function signupPassenger(form){
    const fd=new FormData(form);
    const name=String(fd.get('name')||'').trim().split(' ').filter(Boolean).join(' ');
    const email=String(fd.get('email')||'').trim().toLowerCase();
    const phone=String(fd.get('phone')||'').trim();
    const password=String(fd.get('password')||'');
    const confirm=String(fd.get('confirm')||'');
    if(name.length<2){toast('Enter your full name.');return;}
    if(!email.includes('@')||!email.includes('.')){toast('Enter a valid email address.');return;}
    if(passengerAccounts.some(a=>a.email===email)){toast('An account with this email already exists on this device. Sign in instead.');return;}
    if(password.length<10||!/[A-Za-z]/.test(password)||!/[0-9]/.test(password)){toast('Use at least 10 characters with letters and numbers.');return;}
    if(password!==confirm){toast('The passwords do not match.');return;}
    try{
      const salt=bytesToBase64(crypto.getRandomValues(new Uint8Array(16)));
      const passwordHash=await hashPassengerPassword(password,salt);
      const cardId='ET-'+Math.random().toString(36).slice(2,8).toUpperCase();
      const account={role:'passenger',name,email,phone,salt,passwordHash,cardId,createdAt:now()};
      passengerAccounts.push(account);savePassengerAccounts();
      db.cards.unshift({id:cardId,name,balance:0,status:'Active',type:'Adult',phone,accountEmail:email});
      audit('Passenger account created',name);saveDB();
      startPassengerSession(account,fd.get('remember')==='on');
      toast('Your passenger account and transit card are ready.');
    }catch(e){toast(e.message||'Unable to create account on this browser.');}
  }
  function enterDemoRole(role){
    const demoNames={admin:'Demo Administrator',finance:'Demo Finance Officer',conductor:'Demo Conductor'};
    if(!demoNames[role])return;
    session={role,email:`demo-${role}@local.e-transit`,name:demoNames[role],demo:true};
    persistSession(session,false);activePage=role==='conductor'?'shift':'overview';
    render();toast(`${roleNames[role]} demo workspace opened. Demo access is public.`);
  }
  function logout(){if(session)audit('Signed out',session.name);session=null;localStorage.removeItem(SESSION_KEY);sessionStorage.removeItem(SESSION_KEY);render();}
  function openShift(){const bus=db.buses.find(b=>b.status==='Available');const route=db.routes.find(r=>r.status==='Active'&&(!bus||r.id===bus.route))||db.routes.find(r=>r.status==='Active');if(!route){toast('No active route is available.');return;}if(!bus){toast('No available bus. Update a vehicle to Available first.');activePage='shift';render();return;}db.shifts.unshift({id:id('SH'),conductor:session.email,conductorName:session.name,bus:bus.id,route:route.id,status:'Open',startedAt:now(),closedAt:null});bus.status='On route';audit(`Shift opened · ${bus.plate} · ${route.code}`);saveDB();activePage='shift';render();toast('Your shift is now open.');}
  function closeShift(){const s=db.shifts.find(x=>x.conductor===session.email&&x.status==='Open');if(!s)return;s.status='Closed';s.closedAt=now();const b=db.buses.find(x=>x.id===s.bus);if(b)b.status='Available';audit(`Shift closed · ${s.id}`);saveDB();render();toast('Shift closed successfully.');}
  function recordFare(form){const fd=new FormData(form);const card=db.cards.find(c=>c.id===fd.get('card'))||null;const shift=db.shifts.find(s=>s.conductor===session.email&&s.status==='Open');const route=db.routes.find(r=>r.id===shift?.route);const from=String(fd.get('from')||'');const to=String(fd.get('to')||'');if(!shift||!route){toast('Open a shift before recording a fare.');return;}const method=selectedMethod;if(method!=='Cash'&&(!card||card.status!=='Active')){toast('Choose an active transit card for a card fare.');return;}if(method==='Cash'&&card&&card.status!=='Active'){toast('The selected card is frozen. Clear the card field or select another card.');return;}const i=route.stops.indexOf(from),j=route.stops.indexOf(to);if(i<0||j<=i){toast('Destination must be after the boarding stop.');return;}const amount=Math.max(20,Math.round(route.fare*(j-i)/(route.stops.length-1)));const tx={id:id('TX'),card:card?.id||'CASH',passenger:card?.name||'Cash passenger',route:route.code,from,to,amount,method:method==='Pending'?'Card':method,status:db.online?'Posted':'Queued',at:now(),conductor:session.name,shift:shift.id,batch:null};if(method==='Pending'||!db.online){tx.status='Queued';db.queue.unshift({...tx,queueState:'Pending'});}else if(method==='Card'){if(card.balance<amount){toast('Not enough card balance. Choose cash or top up the demo card.');return;}card.balance-=amount;db.transactions.unshift(tx);}else{db.transactions.unshift(tx);}audit(`${tx.status==='Posted'?'Fare recorded':'Fare queued'} · ${tx.id}`);saveDB();render();toast(tx.status==='Queued'?'Fare saved to the local pending queue.':'Fare recorded in the demo ledger.');}
  function syncQueue(){if(!db.online){toast('Network is offline. Queue retained.');return;}const pending=[...db.queue].reverse();let posted=0,held=0;for(const q of pending){const card=q.method==='Card'?db.cards.find(c=>c.id===q.card):null;if(q.method==='Card'&&(!card||card.status!=='Active')){q.queueState='Review';q.reviewReason='Card missing or frozen';held++;continue;}if(q.method==='Card'&&card.balance<q.amount){q.queueState='Review';q.reviewReason='Insufficient balance at sync';held++;continue;}if(q.method==='Card')card.balance-=q.amount;const tx={...q,status:'Posted',syncedAt:now()};delete tx.queueState;delete tx.reviewReason;db.transactions.unshift(tx);db.queue=db.queue.filter(x=>x.id!==q.id);posted++;}audit(`Offline queue sync · ${posted} posted · ${held} held for review`);saveDB();render();toast(`${posted} fare(s) synced · ${held} held for review.`);}
  function makeSettlement(){const tx=db.transactions.filter(t=>t.status==='Posted'&&!t.batch&&t.type!=='TOPUP');if(!tx.length){toast('There are no unbatched posted fares.');return;}const batch={id:id('ST'),transactionCount:tx.length,cardTotal:tx.filter(t=>t.method==='Card').reduce((s,t)=>s+t.amount,0),cashTotal:tx.filter(t=>t.method==='Cash').reduce((s,t)=>s+t.amount,0),total:tx.reduce((s,t)=>s+t.amount,0),status:'Pending approval',createdBy:session.name,createdAt:now(),approvedBy:null,paidBy:null};tx.forEach(t=>t.batch=batch.id);db.settlements.unshift(batch);audit(`Settlement batch created · ${batch.id}`);saveDB();render();toast('Internal demo settlement batch created.');}
  function exportCSV(){const rows=[['Transaction','Card','Passenger','Route','From','To','Amount LKR','Method','Status','Date','Conductor'],...db.transactions.map(t=>[t.id,t.card,t.passenger,t.route,t.from,t.to,t.amount,t.method,t.status,t.at,t.conductor])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');download('e-transit-transactions.csv',csv,'text/csv');toast('CSV report downloaded.');}
  function download(name,content,type){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
  function handleAction(el){const a=el.dataset.action;switch(a){
    case'show-signup':authMode='signup';renderLogin();break;
    case'show-signin':authMode='signin';renderLogin();break;
    case'enter-demo-role':enterDemoRole(el.dataset.role);break;
    case'toggle-password':{const p=$('#'+(el.dataset.target||'password'));if(p)p.type=p.type==='password'?'text':'password';break;}
    case'logout':logout();break;
    case'navigate':activePage=el.dataset.page;render();break;
    case'toggle-network':db.online=!db.online;saveDB();render();toast(`Demo network ${db.online?'online':'offline'}.`);break;
    case'open-shift':openShift();break;case'close-shift':closeShift();break;
    case'payment-method':selectedMethod=el.dataset.method;render();break;
    case'sync-queue':syncQueue();break;
    case'add-route':{const code=prompt('Route number or code (example: 190)');if(!code)return;const from=prompt('Start location','Fort');if(!from)return;const to=prompt('Destination','Kottawa');if(!to)return;const fare=Number(prompt('Illustrative demo base fare in LKR','150'));if(!Number.isFinite(fare)||fare<=0){toast('Enter a valid fare.');return;}const r={id:id('R'),code,name:`${from} — ${to}`,from,to,stops:[from,'Town Hall',to],fare,class:'Normal',status:'Active'};db.routes.push(r);audit(`Route ${code} created`);saveDB();render();toast('Demo route added.');break;}
    case'toggle-route':{const r=db.routes.find(x=>x.id===el.dataset.id);if(r){r.status=r.status==='Active'?'Paused':'Active';audit(`Route ${r.code} set ${r.status}`);saveDB();render();}break;}
    case'add-bus':{const plate=prompt('Vehicle registration number');if(!plate)return;const route=db.routes[0];const b={id:id('BUS'),plate,model:prompt('Vehicle model','Tata bus')||'Bus',route:route?.id||'',driver:prompt('Driver name','New driver')||'Unassigned',status:'Available',inspection:'2027-06-30'};db.buses.push(b);audit(`Vehicle ${plate} registered`);saveDB();render();toast('Vehicle added.');break;}
    case'cycle-bus':{const b=db.buses.find(x=>x.id===el.dataset.id);if(b){const states=['Available','On route','Maintenance'];b.status=states[(states.indexOf(b.status)+1)%states.length];audit(`${b.plate} status updated to ${b.status}`);saveDB();render();}break;}
    case'add-card':{const name=prompt('Passenger name');if(!name)return;const type=prompt('Card type: Adult / Student','Adult')||'Adult';db.cards.push({id:id('ET'),name,balance:0,status:'Active',type,phone:''});audit(`Transit card issued to ${name}`);saveDB();render();toast('Demo card issued.');break;}
    case'toggle-card':{const c=db.cards.find(x=>x.id===el.dataset.id);if(c){c.status=c.status==='Active'?'Frozen':'Active';audit(`Card ${c.id} ${c.status}`);saveDB();render();toast(`Card ${c.status.toLowerCase()}.`);}break;}
    case'passenger-freeze':{const c=db.cards.find(x=>x.id===session.cardId);if(c){c.status=c.status==='Active'?'Frozen':'Active';audit(`Passenger self-service card ${c.status}`,session.name);saveDB();render();toast(`Card ${c.status.toLowerCase()}.`);}break;}
    case'topup':{const c=db.cards.find(x=>x.id===session.cardId);if(!c)return;const n=Number(prompt('Add demo credit amount in LKR (50–5000)','500'));if(!Number.isFinite(n)||n<50||n>5000){toast('Enter an amount between LKR 50 and 5,000.');return;}c.balance+=n;db.transactions.unshift({id:id('TP'),card:c.id,passenger:c.name,route:'—',from:'—',to:'—',amount:n,method:'Top-up',status:'Posted',type:'TOPUP',at:now(),conductor:'Passenger self-service',batch:null});audit(`Demo credit added · ${money(n)}`,session.name);saveDB();render();toast('Demo credit added. No payment was collected.');break;}
    case'add-incident':{const title=prompt('Incident description');if(!title)return;const route=prompt('Route code','138')||'—';db.incidents.unshift({id:id('INC'),title,route,priority:'Medium',status:'Monitoring',at:now()});audit(`Incident reported · ${title}`);saveDB();render();toast('Incident recorded.');break;}
    case'resolve-incident':{const i=db.incidents.find(x=>x.id===el.dataset.id);if(i){i.status='Resolved';audit(`Incident resolved · ${i.id}`);saveDB();render();}break;}
    case'create-settlement':makeSettlement();break;
    case'approve-settlement':{const s=db.settlements.find(x=>x.id===el.dataset.id);if(s&&s.status==='Pending approval'&&s.createdBy!==session.name){s.status='Approved';s.approvedBy=session.name;s.approvedAt=now();audit(`Settlement ${s.id} approved`);saveDB();render();toast('Batch approved for demo review.');}else toast('A different finance user must approve this batch.');break;}
    case'pay-settlement':{const s=db.settlements.find(x=>x.id===el.dataset.id);if(s&&s.status==='Approved'&&s.approvedBy!==session.name){s.status='Paid';s.paidBy=session.name;s.paidAt=now();audit(`Settlement ${s.id} marked paid in demo`);saveDB();render();toast('Marked paid in demo only. No bank transfer occurred.');}else toast('A different finance user must confirm this action.');break;}
    case'export-transactions':exportCSV();break;
    case'backup':download('e-transit-demo-backup.json',JSON.stringify(db,null,2),'application/json');toast('Demo backup downloaded.');break;
    case'reset-data':if(confirm('Reset all demo records in this browser? This cannot be undone.')){db=makeSeed();saveDB();audit('Demo data reset');render();toast('Demo data reset.');}break;
  }}
  document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();handleAction(el);}});
  document.addEventListener('submit',async e=>{if(e.target.id==='login-form'){e.preventDefault();const f=e.target;await login($('#email').value,$('#password').value,f.elements.remember.checked);}else if(e.target.id==='signup-form'){e.preventDefault();await signupPassenger(e.target);}else if(e.target.id==='fare-form'){e.preventDefault();recordFare(e.target);}});
  document.addEventListener('input',e=>{if(e.target.dataset.search==='cards'){const q=e.target.value.toLowerCase();$('#cards-rows').innerHTML=cardRows(db.cards.filter(c=>`${c.id} ${c.name} ${c.type}`.toLowerCase().includes(q)));}if(e.target.dataset.search==='transactions'){const q=e.target.value.toLowerCase();const st=$('#tx-filter')?.value||'All';const m=$('#tx-method')?.value||'All methods';$('#tx-rows').innerHTML=txRows(db.transactions.filter(t=>`${t.id} ${t.card} ${t.passenger} ${t.route}`.toLowerCase().includes(q)&&(st==='All'||t.status===st)&&(m==='All methods'||t.method===m)));}});
  document.addEventListener('change',e=>{if(e.target.id==='tx-filter'||e.target.id==='tx-method'){const q=$('[data-search="transactions"]')?.value.toLowerCase()||'';const st=$('#tx-filter')?.value||'All';const m=$('#tx-method')?.value||'All methods';$('#tx-rows').innerHTML=txRows(db.transactions.filter(t=>`${t.id} ${t.card} ${t.passenger} ${t.route}`.toLowerCase().includes(q)&&(st==='All'||t.status===st)&&(m==='All methods'||t.method===m)));}if(e.target.id==='restore-file'&&e.target.files[0]){const f=e.target.files[0];const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.cards)||!Array.isArray(data.routes)||!Array.isArray(data.transactions))throw new Error();db=data;saveDB();audit('Demo backup restored');render();toast('Backup restored.');}catch(err){toast('That backup file is not valid for e-Transit.');}};reader.readAsText(f);}});
  window.addEventListener('storage',()=>{db=loadDB();if(session)render();});
  render();
})();
</script>
</body></html>
